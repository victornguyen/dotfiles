pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x {staged_files}
    shell-scripts:
      glob: "scripts/*"
      exclude: "scripts/lib/*"
      run: shellcheck -x {staged_files}
    stylua-check:
      glob: "*.lua"
      run: stylua --check {staged_files}

pre-push:
  commands:
    brew-drift:
      # Shells out to brew, so it is too slow for pre-commit.
      run: ./scripts/brew-drift
