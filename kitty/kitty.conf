# vim:fileencoding=utf-8:ft=kitty:foldmethod=marker

#: Fonts
font_family         Hack Nerd Font Mono
adjust_line_height  2
adjust_column_width -1
font_size 14.0

#: Cursor customization
# `cursor none` is overridden by the theme included below, which sets
# cursor #c8c093. Kept for parity with the Ghostty config's cursor block.
cursor none
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 10

#: Mouse
copy_on_select yes

#: Terminal bell
enable_audio_bell no

#: Window layout
window_padding_width    8
hide_window_decorations titlebar-only
confirm_os_window_close 2

#: Color scheme
background_opacity         0.97

include themes/kanagawa_dragon.conf

#: Advanced
allow_remote_control yes

#: OS specific tweaks
macos_option_as_alt yes
macos_traditional_fullscreen yes
macos_show_window_title_in menubar

#: Font sizes
map kitty_mod+equal     change_font_size all +2.0
map kitty_mod+minus     change_font_size all -2.0
map kitty_mod+backspace change_font_size all 0

#: Select and act on visible text
# Find urls
map kitty_mod+k>u kitten hints --type url

# Find hashes
map kitty_mod+k>h>c kitten hints --type hash --program @
map kitty_mod+k>h>t kitten hints --type hash --program -

# Find paths
map kitty_mod+k>p>c kitten hints --type path --program @
map kitty_mod+k>p>t kitten hints --type path --program -
map kitty_mod+k>p>m kitten hints --multiple --type path --program -
