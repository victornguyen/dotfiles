onboarding = false
# Herdr config — https://herdr.dev/docs/configuration/
# Full annotated defaults: herdr --default-config
# Apply changes: herdr server reload-config

[keys]
prefix = "ctrl+q"
goto = "prefix+s"
settings = "prefix+;"

split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

previous_tab = "prefix+p"
next_tab = "prefix+n"

rename_tab = "prefix+,"

move_tab_previous = "ctrl+alt+left"
move_tab_next = "ctrl+alt+right"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# Popup shell (tmux: bind t display-popup -E -w 80% -h 60%)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
width = "80%"
height = "60%"

[theme]
name = "catppuccin"
auto_switch = false
